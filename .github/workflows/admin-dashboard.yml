name: Admin Dashboard Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/admin-dashboard.yml"
      - "admin-dashboard/**"
      - "src/admin/**"
      - "supabase/functions/admin-api/**"
      - "supabase/functions/_shared/sensitive-text.mjs"
      - "supabase/migrations/*admin*"
      - "supabase/migrations/*app_release_management*"
      - "supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/admin-dashboard.yml"
      - "admin-dashboard/**"
      - "src/admin/**"
      - "supabase/functions/admin-api/**"
      - "supabase/functions/_shared/sensitive-text.mjs"
      - "supabase/migrations/*admin*"
      - "supabase/migrations/*app_release_management*"
      - "supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_ANON_KEY;
          if (!url || !key) {
            throw new Error("VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY GitHub secrets are required.");
          }
          try {
            new URL(url);
          } catch {
            throw new Error("VITE_SUPABASE_URL is not a valid URL.");
          }
          NODE

      - name: Type-check admin application sources
        run: npx tsc --noEmit -p admin-dashboard/tsconfig.json

      - name: Build standalone admin application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:admin:standalone

      - name: Verify and package admin application
        run: |
          test -s dist-admin/index.html
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const output = "dist-admin";
          const html = readFileSync(resolve(output, "index.html"), "utf8");
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map((match) => match[1]);
          const assetPrefix = "/admin/monten500/assets/";
          if (assets.length < 2 || assets.some((asset) => !asset.startsWith(assetPrefix))) {
            throw new Error("Admin HTML assets must be rooted at /admin/monten500/assets/.");
          }
          for (const asset of assets) {
            const filePath = resolve(output, asset.slice("/admin/monten500/".length));
            if (!existsSync(filePath)) throw new Error(`Missing admin asset: ${asset}`);
          }
          NODE
          cd dist-admin
          zip -r ../admin-dashboard.zip .
          test -s ../admin-dashboard.zip

      - name: Upload admin dashboard ZIP
        uses: actions/upload-artifact@v4
        with:
          name: monten-sms-admin-dashboard
          path: admin-dashboard.zip
          if-no-files-found: error
