name: Android Play Store Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/admin-dashboard.yml"
      - ".github/workflows/admin-android-build.yml"
      - "admin-dashboard/**"
      - "src/admin/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Configure optional Firebase Android client
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const raw = process.env.ANDROID_GOOGLE_SERVICES_JSON;
          if (!raw) {
            console.log("Firebase Android config is not supplied; FCM registration will be disabled.");
            process.exit(0);
          }

          let config;
          try {
            config = JSON.parse(raw);
          } catch {
            throw new Error("ANDROID_GOOGLE_SERVICES_JSON must contain valid JSON.");
          }

          const client = config.client?.find(
            (candidate) => candidate.client_info?.android_client_info?.package_name === "com.montensms.app",
          );
          if (
            !config.project_info?.project_id ||
            !config.project_info.project_number ||
            !client?.client_info?.mobilesdk_app_id ||
            !client.api_key?.some((key) => key.current_key)
          ) {
            throw new Error("ANDROID_GOOGLE_SERVICES_JSON must include a complete Firebase client for com.montensms.app.");
          }

          writeFileSync("android/app/google-services.json", raw, { mode: 0o600 });
          console.log("Validated Firebase Android configuration for com.montensms.app.");
          NODE

      - name: Verify required GitHub secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "VITE_SUPABASE_URL",
            "VITE_SUPABASE_ANON_KEY",
            "ANDROID_KEYSTORE_BASE64",
            "ANDROID_KEYSTORE_PASSWORD",
            "ANDROID_KEY_ALIAS",
            "ANDROID_KEY_PASSWORD",
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
          }
          try {
            new URL(process.env.VITE_SUPABASE_URL);
          } catch {
            throw new Error("VITE_SUPABASE_URL is not a valid URL");
          }
          NODE

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/montensms-upload.jks
        run: |
          set +x
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/montensms-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify AAB exists and signature is valid
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: |
          set +x
          test -s "$AAB_PATH"
          verification_log="$RUNNER_TEMP/aab-signature-verification.log"
          if ! jarsigner -verify "$AAB_PATH" > "$verification_log" 2>&1; then
            echo "AAB signature verification failed."
            exit 1
          fi
          if ! grep -Fq "jar verified." "$verification_log"; then
            echo "AAB does not contain a verified signature."
            exit 1
          fi
          echo "AAB exists, is non-empty, and has a verified signature."

      - name: Upload signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: montensms-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/montensms-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify and name signed APK
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set +x
          test -s "$APK_PATH"
          if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"; then
            echo "APK signature verification failed."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Eq "^package: name='com\\.montensms\\.app' versionCode='[1-9][0-9]*' versionName='[^']+' " "$RUNNER_TEMP/apk-badging.txt"
          cp "$APK_PATH" monten-sms.apk
          test -s monten-sms.apk

      - name: Upload signed direct-download APK
        uses: actions/upload-artifact@v4
        with:
          name: monten-sms-android-apk
          path: monten-sms.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/montensms-upload.jks
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/aab-signature-verification.log" "$RUNNER_TEMP/apk-badging.txt"
