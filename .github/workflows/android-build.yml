name: Android Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/admin-dashboard.yml"
      - ".github/workflows/admin-android-build.yml"
      - "admin-dashboard/**"
      - "src/admin/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/admin-dashboard.yml"
      - ".github/workflows/admin-android-build.yml"
      - "admin-dashboard/**"
      - "src/admin/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Configure optional Firebase Android client
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const raw = process.env.ANDROID_GOOGLE_SERVICES_JSON;
          if (!raw) {
            console.log("Firebase Android config is not supplied; FCM registration will be disabled.");
            process.exit(0);
          }

          let config;
          try {
            config = JSON.parse(raw);
          } catch {
            throw new Error("ANDROID_GOOGLE_SERVICES_JSON must contain valid JSON.");
          }

          const client = config.client?.find(
            (candidate) => candidate.client_info?.android_client_info?.package_name === "com.montensms.app",
          );
          if (
            !config.project_info?.project_id ||
            !config.project_info.project_number ||
            !client?.client_info?.mobilesdk_app_id ||
            !client.api_key?.some((key) => key.current_key)
          ) {
            throw new Error("ANDROID_GOOGLE_SERVICES_JSON must include a complete Firebase client for com.montensms.app.");
          }

          writeFileSync("android/app/google-services.json", raw, { mode: 0o600 });
          console.log("Validated Firebase Android configuration for com.montensms.app.");
          NODE

      - name: Verify Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_ANON_KEY;
          const missing = [
            !url && "VITE_SUPABASE_URL",
            !key && "VITE_SUPABASE_ANON_KEY",
          ].filter(Boolean);
          if (missing.length > 0) {
            throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
          }
          try {
            new URL(url);
          } catch {
            throw new Error("VITE_SUPABASE_URL is not a valid URL");
          }
          NODE

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android WebView assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const webDir = "android/app/src/main/assets/public";
          const html = readFileSync(resolve(webDir, "index.html"), "utf8");
          const references = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)];
          if (references.length === 0) {
            throw new Error("Android index.html has no JavaScript or CSS bundle references");
          }

          for (const [, reference] of references) {
            const assetPath = resolve(webDir, reference);
            if (!existsSync(assetPath)) {
              throw new Error(`Android WebView asset is missing: ${reference}`);
            }
          }

          const bundles = references
            .filter(([, reference]) => reference.endsWith(".js"))
            .map(([, reference]) => readFileSync(resolve(webDir, reference), "utf8"));
          if (
            !process.env.VITE_SUPABASE_URL ||
            !process.env.VITE_SUPABASE_ANON_KEY ||
            !bundles.some((bundle) => bundle.includes(process.env.VITE_SUPABASE_URL)) ||
            !bundles.some((bundle) => bundle.includes(process.env.VITE_SUPABASE_ANON_KEY))
          ) {
            throw new Error("Android JavaScript bundle is missing Supabase build configuration");
          }

          const config = JSON.parse(
            readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8"),
          );
          if (config.android?.webContentsDebuggingEnabled !== false) {
            throw new Error("Android WebView debugging must remain disabled");
          }

          console.log(`Verified ${references.length} Android WebView bundle assets`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK configured at $ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and package debug APK
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Eq "^package: name='com\\.montensms\\.app' versionCode='[1-9][0-9]*' versionName='[^']+' " "$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_path"
          mkdir -p artifacts
          cp "$apk_path" artifacts/monten-sms-debug.apk
          cp android/INSTALLATION.md artifacts/INSTALLATION.md
          (cd artifacts && zip -q -j "$GITHUB_WORKSPACE/monten-sms-android-debug.zip" monten-sms-debug.apk INSTALLATION.md)
          test -s monten-sms-android-debug.zip

      - name: Upload MONTEN SMS Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MONTEN-SMS-Android-Debug
          path: artifacts/monten-sms-debug.apk
          if-no-files-found: error

      - name: Upload APK and installation guide ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MONTEN-SMS-Android-Debug-Package
          path: monten-sms-android-debug.zip
          if-no-files-found: error