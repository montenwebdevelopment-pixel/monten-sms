name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_ANON_KEY;
          const missing = [
            !url && "VITE_SUPABASE_URL",
            !key && "VITE_SUPABASE_ANON_KEY",
          ].filter(Boolean);
          if (missing.length > 0) {
            throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
          }
          try {
            new URL(url);
          } catch {
            throw new Error("VITE_SUPABASE_URL is not a valid URL");
          }
          NODE

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android WebView assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const webDir = "android/app/src/main/assets/public";
          const html = readFileSync(resolve(webDir, "index.html"), "utf8");
          const references = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)];
          if (references.length === 0) {
            throw new Error("Android index.html has no JavaScript or CSS bundle references");
          }

          for (const [, reference] of references) {
            const assetPath = resolve(webDir, reference);
            if (!existsSync(assetPath)) {
              throw new Error(`Android WebView asset is missing: ${reference}`);
            }
          }

          const bundles = references
            .filter(([, reference]) => reference.endsWith(".js"))
            .map(([, reference]) => readFileSync(resolve(webDir, reference), "utf8"));
          if (
            !process.env.VITE_SUPABASE_URL ||
            !process.env.VITE_SUPABASE_ANON_KEY ||
            !bundles.some((bundle) => bundle.includes(process.env.VITE_SUPABASE_URL)) ||
            !bundles.some((bundle) => bundle.includes(process.env.VITE_SUPABASE_ANON_KEY))
          ) {
            throw new Error("Android JavaScript bundle is missing Supabase build configuration");
          }

          const config = JSON.parse(
            readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8"),
          );
          if (config.android?.webContentsDebuggingEnabled !== false) {
            throw new Error("Android WebView debugging must remain disabled");
          }

          console.log(`Verified ${references.length} Android WebView bundle assets`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MONTEN SMS Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MONTEN-SMS-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error